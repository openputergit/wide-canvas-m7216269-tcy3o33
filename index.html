<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neubrutalist Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Space Mono', monospace;
            background-color: #f0f0f0;
        }
        .neu-brutal {
            border: 4px solid #000;
            box-shadow: 6px 6px 0 #000;
            transition: all 0.2s ease;
        }
        .neu-brutal:hover {
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0 #000;
        }
        .task-item {
            transition: all 0.2s ease;
        }
        .task-item:hover {
            transform: scale(1.01);
        }
        .priority-high { background-color: #FF6B6B; }
        .priority-medium { background-color: #FFD93D; }
        .priority-low { background-color: #6BCB77; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-4xl font-bold mb-8 neu-brutal bg-white p-4">Task Manager <span class="text-xl">✨</span></h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Task Input Form -->
            <div class="neu-brutal bg-white p-6">
                <h2 class="text-2xl font-bold mb-4">Add New Task</h2>
                <form id="taskForm" class="space-y-4">
                    <div>
                        <label class="block mb-2">Task Title</label>
                        <input type="text" id="taskTitle" class="w-full p-2 neu-brutal" required>
                    </div>
                    <div>
                        <label class="block mb-2">Description</label>
                        <textarea id="taskDescription" class="w-full p-2 neu-brutal" rows="3"></textarea>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block mb-2">Priority</label>
                            <select id="taskPriority" class="w-full p-2 neu-brutal">
                                <option value="low">Low</option>
                                <option value="medium">Medium</option>
                                <option value="high">High</option>
                            </select>
                        </div>
                        <div>
                            <label class="block mb-2">Due Date</label>
                            <input type="date" id="taskDueDate" class="w-full p-2 neu-brutal">
                        </div>
                    </div>
                    <button type="submit" class="w-full p-3 bg-black text-white neu-brutal hover:bg-gray-800">
                        Add Task
                    </button>
                </form>
            </div>

            <!-- Task List -->
            <div class="neu-brutal bg-white p-6">
                <h2 class="text-2xl font-bold mb-4">Tasks</h2>
                <div id="taskList" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('taskForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const title = document.getElementById('taskTitle').value;
            const description = document.getElementById('taskDescription').value;
            const priority = document.getElementById('taskPriority').value;
            const dueDate = document.getElementById('taskDueDate').value;

            addTask(title, description, priority, dueDate);
            this.reset();
        });

        function addTask(title, description, priority, dueDate) {
            const taskList = document.getElementById('taskList');
            const taskDiv = document.createElement('div');
            
            const priorityClass = {
                'high': 'priority-high',
                'medium': 'priority-medium',
                'low': 'priority-low'
            }[priority];

            taskDiv.className = `task-item neu-brutal p-4 ${priorityClass}`;
            taskDiv.innerHTML = `
                <div class="flex justify-between items-start">
                    <div>
                        <h3 class="font-bold">${title}</h3>
                        <p class="text-sm mt-1">${description}</p>
                        <p class="text-sm mt-2">Due: ${dueDate || 'No date set'}</p>
                    </div>
                    <button onclick="this.parentElement.parentElement.remove()" 
                            class="p-1 hover:bg-black hover:text-white rounded">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>
            `;

            taskList.insertBefore(taskDiv, taskList.firstChild);
        }
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
